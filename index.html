<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Buenos Aires After Dark</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#10131a"><meta name="apple-mobile-web-app-capable" content="yes"><style>html,body{margin:0;height:100%;overflow:hidden;background:#08090d;color:white;font-family:Arial}canvas{width:100vw;height:100vh;display:block}.p{position:fixed;top:12px;padding:10px;background:#0009;border:1px solid #ffffff33;border-radius:9px}.l{left:12px}.r{right:12px;text-align:right}.c{left:50%;transform:translateX(-50%)}#start{position:fixed;inset:0;background:#08090def;display:flex;align-items:center;justify-content:center;z-index:4}.card{max-width:650px;padding:28px;border:1px solid #555;border-radius:18px;background:#111}h1{font-size:clamp(32px,6vw,64px);margin:0 0 10px}button{padding:13px 20px;border:0;border-radius:10px;font-weight:bold;font-size:17px}.bar{width:190px;height:9px;background:#333;margin-top:4px}.hp{height:100%;background:#59e378}#msg{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);font-size:22px;font-weight:bold;text-shadow:2px 2px #000}</style></head><body><canvas id="g"></canvas><div class="p l">BA AFTER DARK<br>VIDA <span id="hpt">100</span><div class="bar"><div id="hpb" class="hp"></div></div></div><div class="p c">ENEMIGOS <b id="ec">5</b> · SCORE <b id="sc">0</b></div><div class="p r">MISILES <b id="am">12</b><br>AMETRALLADORA ∞</div><div id="msg"></div><div id="start"><div class="card"><h1>BUENOS AIRES<br>AFTER DARK</h1><p>Vehicular combat arcade estilo era PS1.</p><p><b>WASD / flechas</b> manejar · <b>Espacio</b> disparar · <b>F</b> misil · <b>Shift</b> turbo · <b>R</b> reiniciar</p><button id="play">JUGAR</button></div></div><script>const C=document.querySelector('#g'),x=C.getContext('2d'),K={};let W,H,P,E,B,M,S,over;onresize=()=>{W=innerWidth;H=innerHeight;C.width=W;C.height=H};onresize();onkeydown=e=>{K[e.key.toLowerCase()]=1};onkeyup=e=>K[e.key.toLowerCase()]=0;const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);function reset(){P={x:0,y:450,a:-1.57,v:0,hp:100,ammo:12,cd:0,mc:0,boost:100};E=Array.from({length:5},()=>({x:rnd(-900,900),y:rnd(-900,900),a:rnd(0,6.28),v:0,hp:55,cd:rnd(.3,1)}));B=[];M=[];S=0;over=0;msg.textContent=''}reset();function proj(X,Y){let dx=X-P.x,dy=Y-P.y,ca=Math.cos(-P.a+1.57),sa=Math.sin(-P.a+1.57),rx=dx*ca-dy*sa,ry=dx*sa+dy*ca,z=ry+430,s=430/Math.max(80,z);return{x:W/2+rx*s,y:H*.32+220*s,s,z}}function boom(q){for(let i=0;i<12;i++){let a=rnd(0,6.28);B.push({x:q.x,y:q.y,a,v:0,life:rnd(.1,.35),fx:1})}}function kill(e){E.splice(E.indexOf(e),1);S+=100;boom(e)}function update(t){if(over){if(K.r)reset();return}let ac=(K.w||K.arrowup?250:0)-(K.s||K.arrowdown?180:0);P.v+=ac*t;P.v*=Math.pow(.86,t*10);let turbo=K.shift&&P.boost>0?1.7:1;if(turbo>1)P.boost-=25*t;else P.boost=Math.min(100,P.boost+8*t);P.v=cl(P.v,-170,390*turbo);let st=(K.a||K.arrowleft?-1:0)+(K.d||K.arrowright?1:0);P.a+=st*t*2.1*(P.v>=0?1:-1);P.x+=Math.cos(P.a)*P.v*t;P.y+=Math.sin(P.a)*P.v*t;P.x=cl(P.x,-1250,1250);P.y=cl(P.y,-1250,1250);P.cd-=t;P.mc-=t;if(K[' ']&&P.cd<0){P.cd=.12;B.push({x:P.x,y:P.y,a:P.a,v:700,life:1.1,own:1})}if(K.f&&P.mc<0&&P.ammo){P.mc=.45;P.ammo--;M.push({x:P.x,y:P.y,a:P.a,v:420,life:3})}for(let b of B){if(!b.fx){b.x+=Math.cos(b.a)*b.v*t;b.y+=Math.sin(b.a)*b.v*t}b.life-=t}for(let m of M){let tar=E.slice().sort((a,b)=>d(m,a)-d(m,b))[0];if(tar){let wa=Math.atan2(tar.y-m.y,tar.x-m.x),df=((wa-m.a+Math.PI*3)%(Math.PI*2))-Math.PI;m.a+=cl(df,-2.4*t,2.4*t)}m.x+=Math.cos(m.a)*m.v*t;m.y+=Math.sin(m.a)*m.v*t;m.life-=t}for(let e of E){let wa=Math.atan2(P.y-e.y,P.x-e.x),df=((wa-e.a+Math.PI*3)%(Math.PI*2))-Math.PI;e.a+=cl(df,-1.4*t,1.4*t);e.v+=(d(e,P)>160?150:-30)*t;e.v=cl(e.v*.98,-60,190);e.x+=Math.cos(e.a)*e.v*t;e.y+=Math.sin(e.a)*e.v*t;e.cd-=t;if(d(e,P)<500&&e.cd<0){e.cd=rnd(.7,1.2);B.push({x:e.x,y:e.y,a:wa,v:480,life:1.2,own:0})}}for(let b of B){if(b.fx||b.life<0)continue;if(b.own){for(let e of [...E])if(d(b,e)<28){e.hp-=9;b.life=0;if(e.hp<=0)kill(e)}}else if(d(b,P)<25){P.hp-=6;b.life=0}}for(let m of M){for(let e of [...E])if(d(m,e)<38){e.hp-=30;m.life=0;boom(e);if(e.hp<=0)kill(e)}}B=B.filter(b=>b.life>0);M=M.filter(m=>m.life>0);if(P.hp<=0){P.hp=0;over=1;msg.textContent='DESTRUIDO — R para reiniciar'}if(!E.length){over=1;msg.textContent='VICTORIA — BUENOS AIRES ES TUYA'}hpt.textContent=Math.ceil(P.hp);hpb.style.width=P.hp+'%';ec.textContent=E.length;sc.textContent=S;am.textContent=P.ammo}function draw(){let gr=x.createLinearGradient(0,0,0,H*.55);gr.addColorStop(0,'#241338');gr.addColorStop(1,'#672945');x.fillStyle=gr;x.fillRect(0,0,W,H*.5);x.fillStyle='#090d12';x.fillRect(0,H*.5,W,H*.5);for(let i=0;i<24;i++){x.fillStyle=i%2?'#111':'#181923';x.fillRect(i*W/24,H*.5-(40+i%6*12),W/24+2,100)}let ob=proj(0,-900);if(ob.z>0){x.fillStyle='#ddd4c8';x.beginPath();x.moveTo(ob.x-8*ob.s,ob.y);x.lineTo(ob.x+8*ob.s,ob.y);x.lineTo(ob.x+3*ob.s,ob.y-130*ob.s);x.lineTo(ob.x,ob.y-165*ob.s);x.lineTo(ob.x-3*ob.s,ob.y-130*ob.s);x.fill()}for(let gx=-1000;gx<=1000;gx+=400)for(let gy=-1000;gy<=1000;gy+=400){let p=proj(gx,gy);if(p.z>70&&p.z<1800){x.fillStyle='#333741';x.fillRect(p.x-55*p.s,p.y-80*p.s,110*p.s,160*p.s)}}for(let e of E){let p=proj(e.x,e.y);if(p.z>30){x.save();x.translate(p.x,p.y);x.scale(p.s,p.s);x.rotate(e.a-P.a+1.57);x.fillStyle='#b22d38';x.fillRect(-18,-30,36,55);x.fillStyle='#111';x.fillRect(-12,-20,24,16);x.restore()}}for(let b of B){let p=proj(b.x,b.y);if(p.z>30){x.fillStyle=b.fx?'#ff873b':b.own?'#ffe16a':'#ff5757';x.beginPath();x.arc(p.x,p.y,b.fx?5:3,0,6.28);x.fill()}}for(let m of M){let p=proj(m.x,m.y);if(p.z>30){x.fillStyle='#ff9e3d';x.beginPath();x.arc(p.x,p.y,5,0,6.28);x.fill()}}x.save();x.translate(W/2,H*.8);x.fillStyle='#41434a';x.beginPath();x.moveTo(-42,34);x.lineTo(-34,-42);x.lineTo(34,-42);x.lineTo(42,34);x.fill();x.fillStyle='#16171b';x.fillRect(-23,-24,46,30);x.restore();x.fillStyle='white';x.textAlign='center';x.font='bold 16px Arial';x.fillText(Math.round(Math.abs(P.v)*.72)+' km/h',W/2,H-24)}let last=performance.now();function loop(n){let t=Math.min(.033,(n-last)/1000);last=n;update(t);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);play.onclick=()=>{start.style.display='none';reset()};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
